services:
  mc:
    image: itzg/minecraft-server:2026.10.0-java25
    container_name: mc
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.1.2"
      ONLINE_MODE: "FALSE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      # UUID offline (OfflinePlayer:<pseudo>) de Test_Premium et Test_Crack : en ONLINE_MODE=FALSE
      # l'image essaie quand meme de resoudre les pseudos via l'API Mojang/PlayerDB, qui echoue sur
      # des comptes fictifs. Fournir directement les UUID evite cette resolution.
      WHITELIST: "2b1c5833-3272-3684-9253-a7715c3d7c5c,dc4b10a5-d765-3115-9d87-53880a7e859c"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: ${RCON_PASSWORD}
      RCON_PORT: "25575"
    ports:
      - "25565:25565"
    volumes:
      - mc_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 2m
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mc_net

  backup:
    image: itzg/mc-backup:2026.10.1
    container_name: backup
    depends_on:
      mc:
        condition: service_healthy
    environment:
      BACKUP_METHOD: "restic"
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      # Vide par defaut : docker-compose.ci.yml force un depot local pour les tests.
      # En production, renseigner RESTIC_REPOSITORY=b2:<bucket>:<chemin> + B2_ACCOUNT_ID/KEY dans .env.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY}
      RESTIC_HOST: "minecraft-noel"
      BACKUP_INTERVAL: "1h"
      PRUNE_RESTIC_RETENTION: "--keep-hourly 24 --keep-daily 7"
      RCON_HOST: "mc"
      RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD}
    volumes:
      - mc_data:/data:ro
    restart: unless-stopped
    networks:
      - mc_net

volumes:
  mc_data:

networks:
  mc_net:
